name: Kamal Medical Hall - Android APK Build

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Kamal Medical Hall APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    env:
      EXPO_PUBLIC_API_URL: https://api.kamalmedicalhall.com
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EXPO_PUBLIC_ENV: preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify Android project
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper not found!"
            exit 1
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android app Gradle configuration not found!"
            exit 1
          fi

          echo "Android project verified."

      - name: Build Kamal Medical Hall APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            ./Kamal-Medical-Hall.apk

          ls -lh ./Kamal-Medical-Hall.apk

      - name: Upload Kamal Medical Hall APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamal-Medical-Hall-Android-APK
          path: mobile/Kamal-Medical-Hall.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
