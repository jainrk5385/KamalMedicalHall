
name: Android EAS Preview Build

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo project
        run: npx eas-cli project:info --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Build Android APK on EAS
        run: |
          npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Download APK from EAS
        run: |
          BUILD_ID=$(node -e "const r=require('./build-result.json'); console.log(Array.isArray(r) ? r[0].id : r.id)")
          npx eas-cli build:download \
            --id "$BUILD_ID" \
            --path ./YOI-KIJI.apk
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: YOI-KIJI-Android-APK
          path: mobile/YOI-KIJI.apk
          if-no-files-found: error
          retention-days: 30
