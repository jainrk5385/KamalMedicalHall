
name: Kamal Medical Hall - Android APK Build

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Kamal Medical Hall APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Verify Expo project
      - name: Verify Expo project
        run: npx eas-cli@latest project:info --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      # 5. Build Android APK on EAS Cloud
      - name: Build Android APK on EAS
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build-result.json
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      # 6. Extract Build ID
      - name: Extract EAS Build ID
        id: build
        run: |
          BUILD_ID=$(node -e "
            const fs = require('fs');
            const result = JSON.parse(
              fs.readFileSync('build-result.json', 'utf8')
            );

            const build = Array.isArray(result)
              ? result[0]
              : result;

            if (!build || !build.id) {
              throw new Error('EAS Build ID not found');
            }

            console.log(build.id);
          ")

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      # 7. Download APK and capture actual file path
      - name: Download Kamal Medical Hall APK
        run: |
          set -euo pipefail

          echo "Downloading APK from EAS..."

          npx eas-cli@latest build:download \
            --build-id "${{ steps.build.outputs.build_id }}" \
            --non-interactive 2>&1 | tee download.log

          DOWNLOAD_PATH=$(sed -n \
            's/^Build downloaded to //p' download.log \
            | tail -n 1 \
            | tr -d '\r')

          if [ -z "$DOWNLOAD_PATH" ] || [ ! -f "$DOWNLOAD_PATH" ]; then
            echo "Could not resolve APK path from EAS output."
            echo "Searching temporary directory as fallback..."

            DOWNLOAD_PATH=$(find /tmp/runner/eas-cli-nodejs/eas-build-run-cache \
              -type f \
              -name "*.apk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$DOWNLOAD_PATH" ] || [ ! -f "$DOWNLOAD_PATH" ]; then
            echo "ERROR: APK download file not found!"
            cat download.log
            exit 1
          fi

          cp "$DOWNLOAD_PATH" ./Kamal-Medical-Hall.apk

          if [ ! -s ./Kamal-Medical-Hall.apk ]; then
            echo "ERROR: APK file is empty!"
            exit 1
          fi

          echo "APK successfully prepared:"
          ls -lh ./Kamal-Medical-Hall.apk

      # 8. Upload APK to GitHub Artifacts
      - name: Upload Kamal Medical Hall APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamal-Medical-Hall-Android-APK
          path: mobile/Kamal-Medical-Hall.apk
          if-no-files-found: error
          retention-days: 30
